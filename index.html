<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚽 Туалетная очередь</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap');
        
        :root {
            --bg-primary: #333333;
            --bg-secondary: #444444;
            --bg-card: #3a3a3a;
            --accent: #4CAF50;
            --accent-hover: #66BB6A;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --text-muted: #888888;
            --success: #4CAF50;
            --warning: #FF9800;
            --error: #F44336;
            --border: #555555;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.6s ease;
            background: var(--bg-primary);
            z-index: 100;
            opacity: 1;
        }
        
        .screen.hidden {
            transform: translateX(-100%);
            opacity: 0;
            pointer-events: none;
        }
        
        .screen.slide-in {
            animation: slideIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
        }
        
        .logo {
            font-size: 64px;
            margin-bottom: 30px;
            animation: subtleFloat 4s ease-in-out infinite;
            opacity: 0.9;
        }
        
        .title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            text-align: center;
        }
        
        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            text-align: center;
            margin-bottom: 40px;
            line-height: 1.6;
            opacity: 0.8;
        }
        
        .btn {
            width: 100%;
            padding: 18px 24px;
            margin: 8px 0;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            background: var(--bg-card);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            letter-spacing: -0.3px;
        }
        
        .btn:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
            transform: translateY(-1px);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-accent {
            background: var(--accent);
            border-color: var(--accent);
        }
        
        .btn-accent:hover {
            background: var(--accent-hover);
        }
        
        .time-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 25px 0;
        }
        
        .time-option {
            padding: 16px 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
        }
        
        .time-option:hover {
            border-color: var(--accent);
            transform: scale(1.02);
        }
        
        .time-option.selected {
            background: var(--accent);
            border-color: var(--accent);
        }
        
        .time-option.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: var(--border);
        }
        
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            z-index: 1000;
            transition: color 0.2s;
            padding: 10px;
        }
        
        .back-btn:hover {
            color: var(--text-primary);
        }
        
        .queue-container {
            padding: 20px 0;
            width: 100%;
        }
        
        .queue-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 0 20px;
        }
        
        .queue-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        
        .date-display {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .current-user-card {
            background: var(--bg-card);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 20px;
            margin: 0 20px 25px;
            animation: subtlePulse 3s ease-in-out infinite;
        }
        
        .current-user-id {
            font-size: 32px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 5px;
            color: var(--accent);
        }
        
        .current-user-time {
            text-align: center;
            color: var(--text-secondary);
            font-size: 15px;
        }
        
        .queue-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0 20px;
        }
        
        .queue-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
            opacity: 0;
            animation: fadeInUp 0.4s ease forwards;
        }
        
        .queue-item:hover {
            border-color: var(--accent);
            transform: translateX(4px);
        }
        
        .queue-item.current-user-item {
            background: var(--bg-card);
            border: 2px solid var(--accent);
        }
        
        .queue-id {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .queue-info {
            text-align: right;
        }
        
        .queue-time {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 4px;
        }
        
        .queue-duration {
            color: var(--text-muted);
            font-size: 12px;
        }
        
        .queue-position {
            font-size: 16px;
            font-weight: 500;
            color: var(--accent);
        }
        
        .duration-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        
        .duration-option {
            padding: 14px 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }
        
        .duration-option:hover {
            border-color: var(--accent);
        }
        
        .duration-option.selected {
            background: var(--accent);
            border-color: var(--accent);
        }
        
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--accent);
            color: var(--text-primary);
            padding: 12px 20px;
            border-radius: 6px;
            transform: translateX(100%);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 1000;
            font-size: 14px;
            border: 1px solid var(--border);
        }
        
        .notification.show {
            transform: translateX(0);
            opacity: 1;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--text-secondary);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 8px;
            background: var(--bg-secondary);
            color: var(--text-secondary);
        }
        
        .status-badge.active {
            background: var(--accent);
            color: var(--bg-primary);
        }
        
        @keyframes subtleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        @keyframes subtlePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.9; }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .animate-delay-100 { animation-delay: 0.1s; }
        .animate-delay-200 { animation-delay: 0.2s; }
        .animate-delay-300 { animation-delay: 0.3s; }
        .animate-delay-400 { animation-delay: 0.4s; }
        
        .scroll-hint {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 20px;
            opacity: 0.6;
            animation: subtlePulse 2s infinite;
        }
        
        .divider {
            height: 1px;
            background: var(--border);
            margin: 25px 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <!-- Экран приветствия -->
    <div id="welcomeScreen" class="screen">
        <div class="logo">🚽</div>
        <h1 class="title">Туалетная очередь</h1>
        <p class="subtitle">
            Запишитесь на время или встаньте в живую очередь
        </p>
        <div class="container">
            <button class="btn btn-accent" onclick="showTimeSelection()">
                📅 Записаться по времени
            </button>
            <button class="btn" onclick="showQueue(true)">
                👥 Встать в очередь
            </button>
        </div>
    </div>

    <!-- Экран выбора времени -->
    <div id="timeScreen" class="screen hidden">
        <button class="back-btn" onclick="showWelcome()">←</button>
        <div class="container">
            <h1 class="title">Выберите время</h1>
            <p class="subtitle">Выберите удобное время для посещения</p>
            
            <div class="date-display" id="dateDisplay"></div>
            
            <div id="timeSlots" class="time-options">
                <!-- Временные слоты будут сгенерированы JavaScript -->
            </div>
            
            <div class="divider"></div>
            
            <h2 class="subtitle" style="margin-bottom: 15px;">Длительность посещения</h2>
            <div id="durationOptions" class="duration-options">
                <div class="duration-option" data-minutes="5">5 минут</div>
                <div class="duration-option" data-minutes="10">10 минут</div>
                <div class="duration-option" data-minutes="15" data-selected="true">15 минут</div>
                <div class="duration-option" data-minutes="20">20 минут</div>
                <div class="duration-option" data-minutes="30">30 минут</div>
                <div class="duration-option" data-minutes="45">45 минут</div>
            </div>
            
            <button id="confirmTimeBtn" class="btn btn-accent" onclick="confirmTimeSelection()">
                Подтвердить запись
            </button>
        </div>
    </div>

    <!-- Экран очереди -->
    <div id="queueScreen" class="screen hidden">
        <button class="back-btn" onclick="showWelcome()">←</button>
        <div class="queue-container">
            <div class="queue-header">
                <h1 class="queue-title">Текущая очередь</h1>
                <div class="date-display" id="queueDateDisplay"></div>
                <p class="subtitle" id="queueSubtitle">Загрузка...</p>
            </div>
            
            <div id="currentUserCard" class="current-user-card" style="display: none;">
                <div class="current-user-id" id="currentUserId"></div>
                <div class="current-user-time" id="currentUserTime"></div>
            </div>
            
            <div id="queueList" class="queue-list">
                <!-- Очередь будет сгенерирована JavaScript -->
            </div>
            
            <div class="scroll-hint">↕ Прокрутите вниз для обновления</div>
        </div>
    </div>

    <!-- Уведомление -->
    <div id="notification" class="notification"></div>

    <script>
        // Конфигурация
        const CONFIG = {
            SERVER_URL: 'https://api.github.com/repos/sempstybi-hub/Tyl/contents',
            GITHUB_TOKEN: 'ВАШ_GITHUB_TOKEN', // Нужно заменить на ваш
            BRANCH: 'main'
        };
        
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.hide();
        
        // Глобальные переменные
        let currentUser = null;
        let selectedTime = null;
        let selectedDuration = 15;
        let userQueueId = null;
        let todayQueue = [];
        let isSyncing = false;
        
        // Инициализация пользователя
        function initUser() {
            if (tg.initDataUnsafe?.user) {
                currentUser = {
                    id: tg.initDataUnsafe.user.id,
                    firstName: tg.initDataUnsafe.user.first_name || 'Гость',
                    username: tg.initDataUnsafe.user.username
                };
            } else {
                // Режим отладки
                currentUser = {
                    id: Date.now(),
                    firstName: 'Тестовый Пользователь',
                    username: 'test_user'
                };
            }
        }
        
        // Генерация случайного ID
        function generateRandomId() {
            const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
            const letter = letters[Math.floor(Math.random() * letters.length)];
            const number = Math.floor(Math.random() * 90) + 10;
            return `${letter}${number}`;
        }
        
        // Получение текущей даты в формате YYYY-MM-DD
        function getCurrentDate() {
            const now = new Date();
            return now.toISOString().split('T')[0];
        }
        
        // Получение имени файла для текущей даты
        function getQueueFileName(date = getCurrentDate()) {
            return `queue_${date}.json`;
        }
        
        // Загрузка очереди с GitHub
        async function loadQueueFromGitHub() {
            const date = getCurrentDate();
            const fileName = getQueueFileName(date);
            
            try {
                const response = await fetch(`${CONFIG.SERVER_URL}/${fileName}`, {
                    headers: {
                        'Authorization': `token ${CONFIG.GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (response.status === 200) {
                    const data = await response.json();
                    const content = JSON.parse(atob(data.content));
                    todayQueue = content.queue || [];
                    showNotification('Очередь загружена');
                    return true;
                } else if (response.status === 404) {
                    // Файл не существует, создаем пустую очередь
                    todayQueue = [];
                    return true;
                }
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                // Загружаем из localStorage как запасной вариант
                const localData = localStorage.getItem(`queue_${date}`);
                if (localData) {
                    todayQueue = JSON.parse(localData);
                } else {
                    todayQueue = [];
                }
                showNotification('Используем локальную очередь');
            }
            
            return false;
        }
        
        // Сохранение очереди на GitHub
        async function saveQueueToGitHub() {
            if (isSyncing) return;
            
            isSyncing = true;
            const date = getCurrentDate();
            const fileName = getQueueFileName(date);
            const content = {
                date: date,
                updated: new Date().toISOString(),
                queue: todayQueue
            };
            
            const contentBase64 = btoa(JSON.stringify(content, null, 2));
            
            // Сохраняем локально как запасной вариант
            localStorage.setItem(`queue_${date}`, JSON.stringify(content));
            
            try {
                // Сначала проверяем существование файла
                const checkResponse = await fetch(`${CONFIG.SERVER_URL}/${fileName}`, {
                    headers: {
                        'Authorization': `token ${CONFIG.GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                let sha = null;
                if (checkResponse.status === 200) {
                    const existingData = await checkResponse.json();
                    sha = existingData.sha;
                }
                
                const response = await fetch(`${CONFIG.SERVER_URL}/${fileName}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${CONFIG.GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Update queue for ${date}`,
                        content: contentBase64,
                        sha: sha,
                        branch: CONFIG.BRANCH
                    })
                });
                
                if (response.ok) {
                    showNotification('Очередь сохранена');
                }
            } catch (error) {
                console.error('Ошибка сохранения:', error);
                showNotification('Ошибка синхронизации');
            } finally {
                isSyncing = false;
            }
        }
        
        // Проверка, есть ли пользователь уже в очереди
        function checkUserInQueue() {
            return todayQueue.find(item => item.userId === currentUser.id);
        }
        
        // Генерация временных слотов
        function generateTimeSlots() {
            const container = document.getElementById('timeSlots');
            container.innerHTML = '';
            
            const now = new Date();
            const slots = [];
            
            // Генерируем слоты на ближайшие 3 часа с интервалом 15 минут
            for (let i = 0; i < 12; i++) {
                const time = new Date(now.getTime() + (i + 1) * 15 * 60000);
                const timeString = time.getHours().toString().padStart(2, '0') + ':' + 
                                 time.getMinutes().toString().padStart(2, '0');
                slots.push(timeString);
            }
            
            // Получаем занятые слоты
            const busySlots = [];
            todayQueue.forEach(item => {
                if (item.scheduledTime && item.duration) {
                    const [hours, minutes] = item.scheduledTime.split(':').map(Number);
                    const startTime = hours * 60 + minutes;
                    const endTime = startTime + item.duration;
                    
                    // Добавляем все слоты в пределах длительности как занятые
                    for (let time = startTime; time < endTime; time += 15) {
                        const busyHour = Math.floor(time / 60);
                        const busyMinute = time % 60;
                        busySlots.push(
                            busyHour.toString().padStart(2, '0') + ':' + 
                            busyMinute.toString().padStart(2, '0')
                        );
                    }
                }
            });
            
            slots.forEach(time => {
                const slot = document.createElement('div');
                slot.className = 'time-option';
                slot.textContent = time;
                slot.dataset.time = time;
                
                if (busySlots.includes(time)) {
                    slot.classList.add('disabled');
                    slot.title = 'Время занято';
                } else {
                    slot.onclick = () => selectTimeSlot(slot);
                }
                
                container.appendChild(slot);
            });
        }
        
        // Выбор временного слота
        function selectTimeSlot(element) {
            document.querySelectorAll('.time-option').forEach(slot => {
                slot.classList.remove('selected');
            });
            element.classList.add('selected');
            selectedTime = element.dataset.time;
        }
        
        // Выбор длительности
        function initDurationSelection() {
            const options = document.querySelectorAll('.duration-option');
            options.forEach(option => {
                if (option.dataset.selected === 'true') {
                    option.classList.add('selected');
                    selectedDuration = parseInt(option.dataset.minutes);
                }
                
                option.onclick = function() {
                    options.forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedDuration = parseInt(this.dataset.minutes);
                };
            });
        }
        
        // Подтверждение записи по времени
        async function confirmTimeSelection() {
            if (!selectedTime) {
                showNotification('Выберите время');
                return;
            }
            
            if (checkUserInQueue()) {
                showNotification('Вы уже в очереди');
                return;
            }
            
            userQueueId = generateRandomId();
            
            const queueItem = {
                id: userQueueId,
                userId: currentUser.id,
                firstName: currentUser.firstName,
                scheduledTime: selectedTime,
                duration: selectedDuration,
                joinTime: new Date().toISOString(),
                isTimeSlot: true
            };
            
            todayQueue.push(queueItem);
            await saveQueueToGitHub();
            showQueue(false);
        }
        
        // Добавление в живую очередь
        async function addToLiveQueue() {
            if (checkUserInQueue()) {
                showNotification('Вы уже в очереди');
                return;
            }
            
            userQueueId = generateRandomId();
            
            const queueItem = {
                id: userQueueId,
                userId: currentUser.id,
                firstName: currentUser.firstName,
                scheduledTime: null,
                duration: 15, // Стандартная длительность для живой очереди
                joinTime: new Date().toISOString(),
                isTimeSlot: false
            };
            
            todayQueue.push(queueItem);
            await saveQueueToGitHub();
        }
        
        // Обновление отображения очереди
        function updateQueueDisplay() {
            const container = document.getElementById('queueList');
            const subtitle = document.getElementById('queueSubtitle');
            const currentUserCard = document.getElementById('currentUserCard');
            const currentUserId = document.getElementById('currentUserId');
            const currentUserTime = document.getElementById('currentUserTime');
            
            container.innerHTML = '';
            
            if (todayQueue.length === 0) {
                subtitle.textContent = 'Очередь пуста. Будьте первым!';
                currentUserCard.style.display = 'none';
                return;
            }
            
            // Сортируем очередь
            const sortedQueue = [...todayQueue].sort((a, b) => {
                if (a.scheduledTime && b.scheduledTime) {
                    return a.scheduledTime.localeCompare(b.scheduledTime);
                }
                if (a.scheduledTime) return -1;
                if (b.scheduledTime) return 1;
                return new Date(a.joinTime) - new Date(b.joinTime);
            });
            
            // Обновляем информацию
            subtitle.textContent = `Записей: ${todayQueue.length}`;
            
            // Показываем карточку текущего пользователя
            const userEntry = checkUserInQueue();
            if (userEntry) {
                currentUserCard.style.display = 'block';
                currentUserId.textContent = userEntry.id;
                
                if (userEntry.scheduledTime) {
                    const endTime = calculateEndTime(userEntry.scheduledTime, userEntry.duration);
                    currentUserTime.textContent = `${userEntry.scheduledTime} - ${endTime} (${userEntry.duration} мин)`;
                } else {
                    currentUserTime.textContent = 'Вы в живой очереди';
                }
            } else {
                currentUserCard.style.display = 'none';
            }
            
            // Отображаем очередь
            sortedQueue.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'queue-item';
                div.style.animationDelay = `${index * 0.05}s`;
                
                if (item.userId === currentUser.id) {
                    div.classList.add('current-user-item');
                }
                
                let timeInfo = '';
                let durationInfo = '';
                
                if (item.scheduledTime) {
                    const endTime = calculateEndTime(item.scheduledTime, item.duration);
                    timeInfo = `${item.scheduledTime} - ${endTime}`;
                    durationInfo = `${item.duration} мин`;
                } else {
                    timeInfo = `Встал: ${new Date(item.joinTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
                    durationInfo = `~${item.duration} мин`;
                }
                
                div.innerHTML = `
                    <div class="queue-id">${item.id}</div>
                    <div class="queue-info">
                        <div class="queue-time">${timeInfo}</div>
                        <div class="queue-duration">${durationInfo}</div>
                    </div>
                `;
                
                container.appendChild(div);
            });
        }
        
        // Расчет времени окончания
        function calculateEndTime(startTime, duration) {
            const [hours, minutes] = startTime.split(':').map(Number);
            const totalMinutes = hours * 60 + minutes + duration;
            const endHours = Math.floor(totalMinutes / 60) % 24;
            const endMinutes = totalMinutes % 60;
            return `${endHours.toString().padStart(2, '0')}:${endMinutes.toString().padStart(2, '0')}`;
        }
        
        // Проверка уведомлений
        function checkNotifications() {
            const now = new Date();
            const currentTime = now.getHours().toString().padStart(2, '0') + ':' + 
                              now.getMinutes().toString().padStart(2, '0');
            
            todayQueue.forEach(item => {
                if (item.scheduledTime === currentTime && !item.notified) {
                    item.notified = true;
                    saveQueueToGitHub();
                    
                    if (item.userId === currentUser.id) {
                        showNotification(`Ваше время: ${item.id} в ${currentTime}`);
                    }
                }
            });
        }
        
        // Показ уведомления
        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
        
        // Навигация
        function showWelcome() {
            document.getElementById('welcomeScreen').classList.remove('hidden');
            document.getElementById('timeScreen').classList.add('hidden');
            document.getElementById('queueScreen').classList.add('hidden');
        }
        
        async function showTimeSelection() {
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('timeScreen').classList.remove('hidden');
            document.getElementById('queueScreen').classList.add('hidden');
            
            await loadQueueFromGitHub();
            generateTimeSlots();
            initDurationSelection();
            
            const dateDisplay = document.getElementById('dateDisplay');
            const now = new Date();
            dateDisplay.textContent = now.toLocaleDateString('ru-RU', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }
        
        async function showQueue(isLiveQueue = false) {
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('timeScreen').classList.add('hidden');
            document.getElementById('queueScreen').classList.remove('hidden');
            
            // Обновляем дату
            const dateDisplay = document.getElementById('queueDateDisplay');
            const now = new Date();
            dateDisplay.textContent = now.toLocaleDateString('ru-RU', {
                weekday: 'long',
                day: 'numeric',
                month: 'long'
            });
            
            // Загружаем очередь
            await loadQueueFromGitHub();
            
            // Если нужно добавить в живую очередь
            if (isLiveQueue && !checkUserInQueue()) {
                await addToLiveQueue();
            }
            
            updateQueueDisplay();
        }
        
        // Автообновление каждые 30 секунд
        async function autoRefreshQueue() {
            await loadQueueFromGitHub();
            if (!document.getElementById('queueScreen').classList.contains('hidden')) {
                updateQueueDisplay();
            }
            checkNotifications();
        }
        
        // Инициализация
        async function init() {
            initUser();
            
            // Загружаем начальную очередь
            await loadQueueFromGitHub();
            
            // Автообновление
            setInterval(autoRefreshQueue, 30000);
            
            // Проверяем, если пользователь уже в очереди
            if (checkUserInQueue()) {
                setTimeout(() => showQueue(false), 500);
            }
        }
        
        // Запуск
        init();
    </script>
</body>
</html>
