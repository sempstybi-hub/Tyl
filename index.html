<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <style>
    body {
      background-color: #BBDEFB;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Roboto', Arial, sans-serif;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(0, 150, 136, 0.3); /* Прозрачный Teal */
      border-radius: 50%;
      border-top-color: #009688; /* Teal */
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .loading-text {
      color: #004D40; /* Dark Teal */
      font-size: 1.1rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="loading-container">
    <div class="spinner"></div>
  </div>

  <script>
    // Автоматическое перенаправление с задержкой в 4 секунды
    setTimeout(function() {
      window.location.href = "http://a1214156.xsph.ru"; // Замените на нужный URL
    }, 4000); // 4000 миллисекунд = 4 секунды
  </script>
</body>
</html>
