<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚽 Туалетная очередь</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --accent: #6a11cb;
            --accent-light: #2575fc;
            --text-primary: #ffffff;
            --text-secondary: #b8b8d1;
            --success: #00b894;
            --warning: #fdcb6e;
            --danger: #e17055;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
            background: var(--bg-primary);
            z-index: 100;
        }
        
        .screen.hidden {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
        }
        
        .logo {
            font-size: 64px;
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
        }
        
        .title {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(45deg, var(--accent), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
        }
        
        .subtitle {
            color: var(--text-secondary);
            font-size: 16px;
            text-align: center;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        
        .btn {
            width: 100%;
            padding: 20px;
            margin: 10px 0;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            background: var(--bg-card);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.6s;
        }
        
        .btn:hover::after {
            left: 100%;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(106, 17, 203, 0.3);
            background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
        }
        
        .time-slots-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 30px 0;
        }
        
        .time-slot {
            padding: 15px;
            background: var(--bg-card);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .time-slot:hover {
            transform: scale(1.05);
            border-color: var(--accent);
        }
        
        .time-slot.selected {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(106, 17, 203, 0.4);
        }
        
        .time-slot.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            z-index: 1000;
            transition: color 0.3s;
        }
        
        .back-btn:hover {
            color: var(--text-primary);
        }
        
        .queue-container {
            padding: 20px 0;
        }
        
        .queue-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .queue-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(45deg, var(--accent), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .current-user-card {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            animation: pulse 2s infinite;
            box-shadow: 0 10px 40px rgba(106, 17, 203, 0.3);
        }
        
        .current-user-id {
            font-size: 42px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        
        .current-user-time {
            text-align: center;
            opacity: 0.9;
            font-size: 18px;
        }
        
        .queue-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .queue-item {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .queue-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: linear-gradient(to bottom, var(--accent), var(--accent-light));
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .queue-item:hover::before {
            opacity: 1;
        }
        
        .queue-item:hover {
            transform: translateX(10px);
            background: var(--bg-secondary);
        }
        
        .queue-item.current-user-item {
            background: linear-gradient(135deg, rgba(106, 17, 203, 0.2), rgba(37, 117, 252, 0.2));
            border: 2px solid var(--accent);
        }
        
        .queue-id {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(45deg, var(--accent-light), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .queue-info {
            text-align: right;
        }
        
        .queue-time {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .queue-position {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent-light);
        }
        
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }
        
        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.9; }
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .animate-slide-up {
            animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        .animate-delay-1 { animation-delay: 0.1s; opacity: 0; }
        .animate-delay-2 { animation-delay: 0.2s; opacity: 0; }
        .animate-delay-3 { animation-delay: 0.3s; opacity: 0; }
        .animate-delay-4 { animation-delay: 0.4s; opacity: 0; }
    </style>
</head>
<body>
    <!-- Экран приветствия -->
    <div id="welcomeScreen" class="screen">
        <div class="logo">🚽</div>
        <h1 class="title animate-slide-up">Туалетная очередь</h1>
        <p class="subtitle animate-slide-up animate-delay-1">
            Запишитесь на время или встаньте в живую очередь.<br>
            Получите уведомление, когда подойдёт ваша очередь.
        </p>
        <div class="container animate-slide-up animate-delay-2">
            <button class="btn btn-primary" onclick="showTimeSelection()">
                📅 Записаться по времени
            </button>
            <button class="btn" onclick="showQueue()">
                👥 Встать в очередь
            </button>
        </div>
    </div>

    <!-- Экран выбора времени -->
    <div id="timeScreen" class="screen hidden">
        <button class="back-btn" onclick="showWelcome()">← Назад</button>
        <div class="container">
            <h1 class="title animate-slide-up">Выберите время</h1>
            <p class="subtitle animate-slide-up animate-delay-1">
                Выберите удобное время для посещения
            </p>
            
            <div id="timeSlots" class="time-slots-grid animate-slide-up animate-delay-2">
                <!-- Временные слоты будут сгенерированы JavaScript -->
            </div>
            
            <button id="confirmTimeBtn" class="btn btn-primary animate-slide-up animate-delay-3" onclick="confirmTimeSelection()">
                Подтвердить выбор
            </button>
        </div>
    </div>

    <!-- Экран очереди -->
    <div id="queueScreen" class="screen hidden">
        <button class="back-btn" onclick="showWelcome()">← Назад</button>
        <div class="queue-container">
            <div class="queue-header animate-slide-up">
                <h1 class="queue-title">Текущая очередь</h1>
                <p class="subtitle" id="queueSubtitle">
                    <!-- Текст будет обновляться JavaScript -->
                </p>
            </div>
            
            <div id="currentUserCard" class="current-user-card animate-slide-up animate-delay-1" style="display: none;">
                <div class="current-user-id" id="currentUserId"></div>
                <div class="current-user-time" id="currentUserTime"></div>
            </div>
            
            <div id="queueList" class="queue-list animate-slide-up animate-delay-2">
                <!-- Очередь будет сгенерирована JavaScript -->
            </div>
        </div>
    </div>

    <!-- Уведомление -->
    <div id="notification" class="notification"></div>

    <script>
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.hide();
        
        // Глобальные переменные
        let queue = JSON.parse(localStorage.getItem('toiletQueue')) || [];
        let currentUser = null;
        let selectedTime = null;
        let userQueueId = null;
        
        // Инициализация пользователя
        function initUser() {
            if (tg.initDataUnsafe?.user) {
                currentUser = {
                    id: tg.initDataUnsafe.user.id,
                    firstName: tg.initDataUnsafe.user.first_name || 'Пользователь',
                    username: tg.initDataUnsafe.user.username
                };
            } else {
                // Режим отладки
                currentUser = {
                    id: Date.now(),
                    firstName: 'Тестовый Пользователь',
                    username: 'test_user'
                };
            }
            
            // Проверяем, есть ли пользователь уже в очереди
            checkExistingQueue();
        }
        
        // Генерация случайного ID (буква + 2 цифры)
        function generateRandomId() {
            const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
            const letter = letters[Math.floor(Math.random() * letters.length)];
            const number = Math.floor(Math.random() * 90) + 10; // 10-99
            return letter + number;
        }
        
        // Проверка существования пользователя в очереди
        function checkExistingQueue() {
            const existingEntry = queue.find(item => item.userId === currentUser.id);
            if (existingEntry) {
                userQueueId = existingEntry.id;
                selectedTime = existingEntry.scheduledTime;
                showQueue();
            }
        }
        
        // Генерация временных слотов
        function generateTimeSlots() {
            const container = document.getElementById('timeSlots');
            container.innerHTML = '';
            
            const now = new Date();
            const slots = [];
            
            // Генерируем слоты на ближайшие 4 часа с интервалом 15 минут
            for (let i = 0; i < 16; i++) {
                const time = new Date(now.getTime() + (i + 1) * 15 * 60000);
                const timeString = time.getHours().toString().padStart(2, '0') + ':' + 
                                 time.getMinutes().toString().padStart(2, '0');
                slots.push(timeString);
            }
            
            // Отмечаем занятые слоты
            const busySlots = queue.map(item => item.scheduledTime).filter(Boolean);
            
            slots.forEach(time => {
                const slot = document.createElement('div');
                slot.className = 'time-slot';
                slot.textContent = time;
                slot.dataset.time = time;
                
                if (busySlots.includes(time)) {
                    slot.classList.add('disabled');
                    slot.title = 'Время занято';
                } else {
                    slot.onclick = () => selectTimeSlot(slot);
                }
                
                container.appendChild(slot);
            });
        }
        
        // Выбор временного слота
        function selectTimeSlot(element) {
            document.querySelectorAll('.time-slot').forEach(slot => {
                slot.classList.remove('selected');
            });
            element.classList.add('selected');
            selectedTime = element.dataset.time;
        }
        
        // Подтверждение выбора времени
        function confirmTimeSelection() {
            if (!selectedTime) {
                showNotification('Выберите время');
                return;
            }
            
            // Генерируем случайный ID
            userQueueId = generateRandomId();
            
            // Добавляем в очередь
            const queueItem = {
                id: userQueueId,
                userId: currentUser.id,
                firstName: currentUser.firstName,
                scheduledTime: selectedTime,
                joinTime: new Date().toISOString(),
                isRandom: false
            };
            
            queue.push(queueItem);
            saveQueue();
            
            // Показываем очередь
            showQueue();
        }
        
        // Добавление в живую очередь (без времени)
        function addToLiveQueue() {
            // Генерируем случайный ID
            userQueueId = generateRandomId();
            
            // Добавляем в очередь
            const queueItem = {
                id: userQueueId,
                userId: currentUser.id,
                firstName: currentUser.firstName,
                scheduledTime: null,
                joinTime: new Date().toISOString(),
                isRandom: true
            };
            
            queue.push(queueItem);
            saveQueue();
            
            // Показываем очередь
            showQueue();
        }
        
        // Сохранение очереди
        function saveQueue() {
            localStorage.setItem('toiletQueue', JSON.stringify(queue));
        }
        
        // Обновление отображения очереди
        function updateQueueDisplay() {
            const container = document.getElementById('queueList');
            const subtitle = document.getElementById('queueSubtitle');
            const currentUserCard = document.getElementById('currentUserCard');
            const currentUserId = document.getElementById('currentUserId');
            const currentUserTime = document.getElementById('currentUserTime');
            
            container.innerHTML = '';
            
            if (queue.length === 0) {
                subtitle.textContent = 'Очередь пуста. Будьте первым!';
                currentUserCard.style.display = 'none';
                return;
            }
            
            // Сортируем очередь: по времени, затем по времени добавления
            const sortedQueue = [...queue].sort((a, b) => {
                if (a.scheduledTime && b.scheduledTime) {
                    return a.scheduledTime.localeCompare(b.scheduledTime);
                }
                if (a.scheduledTime) return -1;
                if (b.scheduledTime) return 1;
                return new Date(a.joinTime) - new Date(b.joinTime);
            });
            
            // Обновляем подзаголовок
            subtitle.textContent = `Всего в очереди: ${queue.length} человек`;
            
            // Показываем карточку текущего пользователя
            const userEntry = queue.find(item => item.userId === currentUser.id);
            if (userEntry) {
                currentUserCard.style.display = 'block';
                currentUserId.textContent = userEntry.id;
                currentUserTime.textContent = userEntry.scheduledTime 
                    ? `Ваше время: ${userEntry.scheduledTime}`
                    : `Вы в живой очереди`;
            } else {
                currentUserCard.style.display = 'none';
            }
            
            // Отображаем очередь
            sortedQueue.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'queue-item';
                
                if (item.userId === currentUser.id) {
                    div.classList.add('current-user-item');
                }
                
                const timeInfo = item.scheduledTime 
                    ? `Время: ${item.scheduledTime}`
                    : `Встал в: ${new Date(item.joinTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
                
                const position = index + 1;
                let positionText = '';
                
                if (item.scheduledTime) {
                    positionText = `⏰ ${item.scheduledTime}`;
                } else {
                    positionText = `#${position}`;
                }
                
                div.innerHTML = `
                    <div class="queue-id">${item.id}</div>
                    <div class="queue-info">
                        <div class="queue-position">${positionText}</div>
                        <div class="queue-time">${item.firstName}</div>
                    </div>
                `;
                
                container.appendChild(div);
            });
        }
        
        // Проверка и отправка уведомлений
        function checkAndSendNotifications() {
            const now = new Date();
            const currentTime = now.getHours().toString().padStart(2, '0') + ':' + 
                              now.getMinutes().toString().padStart(2, '0');
            
            queue.forEach(item => {
                if (item.scheduledTime === currentTime && !item.notified) {
                    item.notified = true;
                    saveQueue();
                    
                    if (item.userId === currentUser.id) {
                        showNotification(`⏰ Ваше время подошло! Номер ${item.id}`);
                        
                        // В реальном приложении здесь будет отправка уведомления через Telegram Bot API
                        if (tg && tg.showPopup) {
                            setTimeout(() => {
                                tg.showPopup({
                                    title: '⏰ Ваша очередь!',
                                    message: `Номер ${item.id}, ваше время в туалет на ${item.scheduledTime}`,
                                    buttons: [{ type: 'ok' }]
                                });
                            }, 1000);
                        }
                    }
                }
            });
        }
        
        // Показ уведомления
        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
        
        // Навигация между экранами
        function showWelcome() {
            document.getElementById('welcomeScreen').classList.remove('hidden');
            document.getElementById('timeScreen').classList.add('hidden');
            document.getElementById('queueScreen').classList.add('hidden');
        }
        
        function showTimeSelection() {
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('timeScreen').classList.remove('hidden');
            document.getElementById('queueScreen').classList.add('hidden');
            
            generateTimeSlots();
        }
        
        function showQueue() {
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('timeScreen').classList.add('hidden');
            document.getElementById('queueScreen').classList.remove('hidden');
            
            // Если пользователь нажал "Встать в очередь", добавляем его
            if (!userQueueId && !queue.find(item => item.userId === currentUser.id)) {
                addToLiveQueue();
            }
            
            updateQueueDisplay();
        }
        
        // Очистка старых записей (старше 24 часов)
        function cleanupOldEntries() {
            const now = new Date();
            const twentyFourHoursAgo = new Date(now.getTime() - 24 * 60 * 60 * 1000);
            
            queue = queue.filter(item => {
                const joinDate = new Date(item.joinTime);
                return joinDate > twentyFourHoursAgo;
            });
            
            saveQueue();
        }
        
        // Синхронизация через localStorage (имитация)
        function syncQueue() {
            // В реальном приложении здесь будет синхронизация с сервером
            const savedQueue = localStorage.getItem('toiletQueue');
            if (savedQueue) {
                try {
                    const parsed = JSON.parse(savedQueue);
                    // Слияние локальной и сохраненной очереди
                    queue = [...queue, ...parsed]
                        .filter((item, index, self) =>
                            index === self.findIndex(t => t.userId === item.userId)
                        );
                    saveQueue();
                } catch (e) {
                    console.error('Ошибка синхронизации:', e);
                }
            }
        }
        
        // Инициализация приложения
        function init() {
            initUser();
            cleanupOldEntries();
            syncQueue();
            
            // Проверяем уведомления каждую минуту
            setInterval(checkAndSendNotifications, 60000);
            
            // Первоначальная проверка
            checkAndSendNotifications();
            
            // Автоматический показ очереди, если пользователь уже в ней
            if (userQueueId) {
                setTimeout(() => showQueue(), 500);
            }
        }
        
        // Запуск приложения
        init();
    </script>
</body>
</html>
