<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перенаправление</title>
    <style>
        body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            margin: 0;
        }
        .loader {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 146px;
            height: 146px;
        }
        .loader::before,
        .loader::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            animation-duration: 1.8s;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
            filter: drop-shadow(0 0 11px rgba(255, 255, 255, 0.75));
        }
        .loader::before {
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 0 17px #fff;
            animation-name: pulsA;
        }
        .loader::after {
            width: calc(100% - 34px);
            height: calc(100% - 34px);
            box-shadow: 0 0 0 0 #fff;
            animation-name: pulsB;
        }
        @keyframes pulsA {
            0% {
                box-shadow: inset 0 0 0 17px #fff;
                opacity: 1;
            }
            50%, 100% {
                box-shadow: inset 0 0 0 0 #fff;
                opacity: 0;
            }
        }
        @keyframes pulsB {
            0%, 50% {
                box-shadow: 0 0 0 0 #fff;
                opacity: 0;
            }
            100% {
                box-shadow: 0 0 0 17px #fff;
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <script>
        // Автоматическое перенаправление с задержкой в 2 секунды
        setTimeout(function() {
            window.location.href = "http://a1213960.xsph.ru";
        }, 2000); // 2000 миллисекунд = 2 секунды
    </script>
</body>
</html>
